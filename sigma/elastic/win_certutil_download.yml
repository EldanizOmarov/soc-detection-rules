title: Certutil URL Download
id: e1e24489-2fa4-520c-9df6-b5c9f27bf342
status: test
description: certutil -urlcache ile yükləmə (Hunt-H4).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.command_and_control
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \certutil.exe
    CommandLine|contains:
    - -urlcache
    - -verifyctl
    - http://
    - https://
  condition: selection
falsepositives:
- Sertifikat əməliyyatları
level: high
x_test: certutil -urlcache -split -f http://127.0.0.1:9/soc.txt %TEMP%\soc.txt
