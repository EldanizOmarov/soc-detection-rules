# Elastic SIEM + Logstash router + web (nginx) + SMTP sink (MailHog)
# Parollar .env faylindan oxunur (git-e DUSMUR)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "9201:9200"
    mem_limit: 2GB
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KB_KEY_ENC}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KB_KEY_SEC}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KB_KEY_REP}

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: logstash
    user: root
    depends_on: [elasticsearch]
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - CONFIG_RELOAD_AUTOMATIC=true
      - CONFIG_RELOAD_INTERVAL=5s
      - XPACK_MONITORING_ENABLED=false
      - PIPELINE_WORKERS=2
    mem_limit: 1GB
    ports:
      - "5044:5044"
      - "5140:5140"
      - "5141:5141"
      - "5142:5142"
      - "127.0.0.1:9600:9600"
    volumes:
      - /root/soc-detection-rules/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - /var/log/cold_storage:/var/log/cold_storage
      - /var/log/auth.log:/host/auth.log:ro
      - /var/log/soc-web:/host/soc-web:ro

  web:
    image: nginx:alpine
    container_name: soc-web
    ports:
      - "8080:80"
    volumes:
      - /root/soc-detection-rules/elastic-stack/nginx-soc.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/soc-web:/var/log/nginx

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "127.0.0.1:25:1025"
      - "8025:8025"

volumes:
  esdata:
