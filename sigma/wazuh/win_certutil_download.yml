title: Certutil URL Download
id: 103c89c5-789a-5261-be66-f918baa4ca0a
status: test
description: certutil.exe ile xarici URL-den fayl yuklənməsi (LOLBin).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.command_and_control
- attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \certutil.exe
    CommandLine|contains:
    - -urlcache
    - -verifyctl
    - http://
    - https://
  condition: selection
falsepositives:
- Sertifikat yenilənmələri
level: high
x_test: certutil -urlcache -split -f http://127.0.0.1:9/soc.txt %TEMP%\soc.txt
x_wazuh_id: 100310
