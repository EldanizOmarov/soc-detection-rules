title: PowerShell Encoded Command
id: 40a94d96-178e-57d2-9387-46a8addb2f26
status: test
description: PowerShell -enc ile gizlədilmiş komanda (Hunt-H1).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.execution
- attack.t1059.001
- attack.defense_evasion
- attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -enc '
    - ' -encodedcommand '
  condition: selection
falsepositives:
- Inzibati skriptlər
level: high
x_test: powershell.exe -NoProfile -enc VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAHMAbwBjACcA
