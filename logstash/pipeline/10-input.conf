# 6.2 - Merkezi log router: butun menbeler bu pipeline-a daxil olur
input {
  # Endpoint + Windows auth: Winlogbeat (Sysmon, Security, PowerShell kanallari)
  beats { port => 5044 }

  # Network: firewall/syslog menbeyi (TCP 5140)
  tcp { port => 5140 type => "network" codec => line }

  # Email: mail gateway logu (TCP 5141)
  tcp { port => 5141 type => "email" codec => line }

  # Cloud: CloudTrail formatli JSON loglar (TCP 5142)
  tcp { port => 5142 type => "cloud" codec => json_lines }

  # Auth (Linux): real /var/log/auth.log
  file {
    path => "/host/auth.log"
    type => "linux-auth"
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/sincedb_auth"
  }

  # Web: nginx access log
  file {
    path => "/host/soc-web/access.log"
    type => "web"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_web"
  }
}
