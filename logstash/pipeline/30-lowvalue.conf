# 6.2 - Asagi deyerli, yuksek hecmli loglar SIEM indeksine DUSMUR, lakin cold storage-a arxivlenir
filter {
  # Windows Filtering Platform (icazeli baglantilar) ve handle/obyekt eməliyyatlari
  if [winlog][channel] == "Security" and [event][code] in ["5152","5156","5157","5158","4656","4658","4690","4663","5379"] {
    mutate { add_tag => ["low_value"] }
  }
  # DEBUG seviyyeli mesajlar
  if [message] =~ /DEBUG/ { mutate { add_tag => ["low_value"] } }
  # Linux CRON sessiya sesi
  if [type] == "linux-auth" and [message] =~ /CRON\[/ { mutate { add_tag => ["low_value"] } }
  # Firewall ALLOW trafiki (yalniz DENY saxlanilir)
  if [type] == "network" and [event][action] == "ALLOW" { mutate { add_tag => ["low_value"] } }
}
