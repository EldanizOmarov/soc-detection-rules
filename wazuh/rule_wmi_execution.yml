title: WMI Vasitəsilə Uzaqdan Əmr İcrası
id: w1012
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (WMI Vasitəsilə Uzaqdan Əmr İcrası).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith: 'wmic.exe' and CommandLine|contains: 'process call create'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: high
tags:
    - attack.execution
    - attack.t1047
