title: Credential Dumping Command Keywords (Security 4688)
id: 4eb00d29-f55f-515c-a8f4-42f8617cd4d3
status: test
description: mimikatz/sekurlsa/lsadump acar sozleri (T1003); Security 4688.
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.credential_access
- attack.t1003
logsource:
  product: windows
  service: security
detection:
  selection:
    CommandLine|contains:
    - 'sekurlsa::'
    - 'lsadump::'
    - privilege::debug
    - mimikatz
  condition: selection
falsepositives:
- Təhlükəsizlik komandasının testləri
level: critical
x_test: cmd.exe /c echo sekurlsa::logonpasswords   (yalniz echo)
x_wazuh_id: 100540
x_wazuh_if_sid: 67027
