title: Credential Dumping Command Keywords
id: 3c174aa0-9fef-5518-8ecb-2fe65b9e641f
status: test
description: Komanda sətrində mimikatz/sekurlsa/lsadump açar sözləri (T1003).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.credential_access
- attack.t1003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - 'sekurlsa::'
    - 'lsadump::'
    - privilege::debug
    - mimikatz
  condition: selection
falsepositives:
- Təhlükəsizlik komandasının testləri
level: critical
x_test: cmd.exe /c echo sekurlsa::logonpasswords   (yalniz echo)
x_wazuh_id: 100470
