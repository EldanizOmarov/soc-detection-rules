title: Certutil Vasitəsilə Zərərli Fayl Çəkilməsi
id: w1014
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Certutil Vasitəsilə Zərərli Fayl Çəkilməsi).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith: 'certutil.exe' and CommandLine|contains: '-urlcache'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: high
tags:
    - attack.defense_evasion
    - attack.t1140
