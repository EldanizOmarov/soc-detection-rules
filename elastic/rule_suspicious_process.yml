title: Tanınmayan Process İcra Edilməsi
id: 9c0d1e2f-3a4b-5c6d-7e8f-9a0b1c2d3e4f
status: stable
description: Tanınmayan Process İcra Edilməsi üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası.
author: Eldaniz Omarov
logsource:
product: windows
service: sysmon
detection:
selection:
    EventID: 1 and ParentImage|endswith: '\cmd.exe'
condition: selection
falsepositives:
- Qanuni sistem inzibatçısı əməliyyatları
level: medium
tags:
- attack.execution
- attack.t1059.003
