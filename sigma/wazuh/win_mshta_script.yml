title: Mshta Script or URL Execution
id: bcb6716d-a7e2-5275-8b55-2b4232604926
status: test
description: mshta.exe vbscript/javascript və ya URL ile icra edir (T1218.005).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.defense_evasion
- attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \mshta.exe
    CommandLine|contains:
    - 'vbscript:'
    - 'javascript:'
    - http://
    - https://
  condition: selection
falsepositives:
- 'Nadir: köhnə HTA tətbiqləri'
level: high
x_test: mshta.exe vbscript:Close(Execute("x=1"))
x_wazuh_id: 100330
