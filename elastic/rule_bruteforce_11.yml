title: Çoxlu Uğursuz Giriş Cəhdi (Brute Force)
id: a1b2c3d4-e5f6-7890-1234-56789abcdef0
status: stable
description: Qısa müddətdə təkrarlanan Event ID 4625 (Failed Logon) aşkarlanması.
author: Eldaniz Omarov
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection | count() > 5
falsepositives:
    - Parolunu unudan istifadəçilər
level: medium
tags:
    - attack.initial_access
    - attack.t1110
