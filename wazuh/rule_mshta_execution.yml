title: Mshta Vasitəsilə Skript İcrası
id: w1015
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Mshta Vasitəsilə Skript İcrası).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
