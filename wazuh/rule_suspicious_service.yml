title: Şübhəli Servis Yaradılması (sc.exe)
id: w1009
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Şübhəli Servis Yaradılması (sc.exe)).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith: 'sc.exe' and CommandLine|contains: 'create'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: medium
tags:
    - attack.persistence
    - attack.t1543.003
