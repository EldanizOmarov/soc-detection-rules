title: Sistem Məlumatlarının Yoxlanılması (systeminfo)
id: w1007
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Sistem Məlumatlarının Yoxlanılması (systeminfo)).
author: Eldaniz Omarov
logsource:
