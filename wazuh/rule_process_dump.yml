title: Task Manager Vasitəsilə Process Dump
id: w1008
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Task Manager Vasitəsilə Process Dump).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        TargetImage|endswith: 'taskmgr.exe' and GrantedAccess: '0x1FFFFF'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: high
tags:
    - attack.credential_access
    - attack.t1003.001
