log_format soc '$http_x_forwarded_for|$remote_addr|$remote_user|[$time_local]|"$request"|$status|$body_bytes_sent|"$http_referer"|"$http_user_agent"';
server {
  listen 80;
  access_log /var/log/nginx/access.log soc;
  location / { return 200 "SOC lab web\n"; }
  location /login { return 401; }
  location /search { return 200 "results\n"; }
}
