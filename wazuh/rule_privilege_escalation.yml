title: UAC Bypass Cəhdi
id: w1002
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (UAC Bypass Cəhdi).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        ParentImage|endswith: '\fodhelper.exe'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: high
tags:
    - attack.privilege_escalation
    - attack.t1548.002
