title: Bitsadmin ilə Fayl Endirilməsi
id: w1013
status: stable
description: Wazuh üçün avtomatlaşdırılmış real SIGMA aşkarlama qaydası (Bitsadmin ilə Fayl Endirilməsi).
author: Eldaniz Omarov
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        Image|endswith: 'bitsadmin.exe' and CommandLine|contains: '/transfer'
    condition: selection
falsepositives:
    - Qanuni sistem inzibatçısı əməliyyatları
level: high
tags:
    - attack.defense_evasion
    - attack.t1197
