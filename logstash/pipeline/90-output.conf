output {
  # Deyerli loglar -> Elasticsearch dedicated indekslerine
  if "low_value" not in [tags] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      user     => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index    => "soc-%{[@metadata][soc_type]}-%{+YYYY.MM.dd}"
      action   => "create"
    }
  }

  # Suzulen (low_value) loglar -> gzip cold storage arxivi
  if "low_value" in [tags] {
    file {
      path  => "/var/log/cold_storage/%{[@metadata][soc_type]}-%{+YYYY.MM.dd}.log.gz"
      gzip  => true
      codec => json_lines
    }
  }
}
