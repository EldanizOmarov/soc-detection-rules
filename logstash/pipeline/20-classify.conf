# Her hadise 6 dedicated indeksden birine yonlendirilir: endpoint, network, web, email, auth, cloud
filter {

  # ---------------- NETWORK (firewall syslog) ----------------
  if [type] == "network" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:[@metadata][ts]} %{WORD:[observer][name]} action=%{WORD:[event][action]} proto=%{WORD:[network][transport]} src=%{IP:[source][ip]} dst=%{IP:[destination][ip]} dport=%{INT:[destination][port]}" }
      tag_on_failure => ["_grok_network_failed"]
    }
    mutate { convert => { "[destination][port]" => "integer" } add_field => { "[@metadata][soc_type]" => "network" } }
  }

  # ---------------- EMAIL (mail gateway) ----------------
  else if [type] == "email" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:[@metadata][ts]} %{WORD:[observer][name]} %{DATA:[process][name]}: from=<%{DATA:[email][from][address]}> to=<%{DATA:[email][to][address]}> subject=\"%{DATA:[email][subject]}\" attachment=\"%{DATA:[email][attachments][file][name]}\" client=%{IP:[source][ip]} status=%{WORD:[event][outcome]}" }
      tag_on_failure => ["_grok_email_failed"]
    }
    grok { match => { "[email][attachments][file][name]" => "\.(?<[email][attachments][file][extension]>[A-Za-z0-9]+)$" } tag_on_failure => [] }
    mutate { add_field => { "[@metadata][soc_type]" => "email" } }
  }

  # ---------------- CLOUD (CloudTrail JSON) ----------------
  else if [type] == "cloud" {
    mutate {
      rename => {
        "eventName"        => "[event][action]"
        "eventSource"      => "[event][provider]"
        "sourceIPAddress"  => "[source][ip]"
        "awsRegion"        => "[cloud][region]"
      }
    }
    if [userIdentity][type] { mutate { rename => { "[userIdentity][type]" => "[aws][cloudtrail][user_identity][type]" } } }
    if [userIdentity][userName] { mutate { rename => { "[userIdentity][userName]" => "[user][name]" } } }
    if [additionalEventData][MFAUsed] { mutate { rename => { "[additionalEventData][MFAUsed]" => "[aws][cloudtrail][mfa_used]" } } }
    mutate { remove_field => ["userIdentity", "additionalEventData"] add_field => { "[@metadata][soc_type]" => "cloud" } }
  }

  # ---------------- AUTH (Linux auth.log) ----------------
  else if [type] == "linux-auth" {
    grok {
      match => { "message" => [
        "^%{TIMESTAMP_ISO8601:[@metadata][ts]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[soc][msg]}",
        "^%{SYSLOGTIMESTAMP:[@metadata][ts]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[soc][msg]}"
      ] }
      tag_on_failure => ["_grok_auth_failed"]
    }
    if [soc][msg] =~ /(authentication failure|Failed password|incorrect password|Invalid user)/ { mutate { add_field => { "[event][outcome]" => "failure" } } }
    else if [soc][msg] =~ /(session opened|Accepted)/ { mutate { add_field => { "[event][outcome]" => "success" } } }
    grok { match => { "[soc][msg]" => ["rhost=%{IP:[source][ip]}", "from %{IP:[source][ip]} port"] } tag_on_failure => [] }
    mutate { add_field => { "[event][category]" => "authentication" "[@metadata][soc_type]" => "auth" } }
  }

  # ---------------- WEB (nginx) ----------------
  else if [type] == "web" {
    dissect {
      mapping => { "message" => "%{[@metadata][xff]}|%{[@metadata][remote]}|%{[user][name]}|[%{[@metadata][ts]}]|\"%{[@metadata][req]}\"|%{[http][response][status_code]}|%{[http][response][body][bytes]}|\"%{[http][request][referrer]}\"|\"%{[user_agent][original]}\"" }
      tag_on_failure => ["_dissect_web_failed"]
    }
    mutate { gsub => ["[@metadata][xff]", ",.*$", ""] }
    if [@metadata][xff] and [@metadata][xff] != "-" {
      mutate { add_field => { "[source][ip]" => "%{[@metadata][xff]}" } }
    } else {
      mutate { add_field => { "[source][ip]" => "%{[@metadata][remote]}" } }
    }
    grok { match => { "[@metadata][req]" => "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]}(?: HTTP/%{NUMBER:[http][version]})?" } tag_on_failure => [] }
    mutate { convert => { "[http][response][status_code]" => "integer" } add_field => { "[@metadata][soc_type]" => "web" } }
    urldecode { field => "[url][original]" all_fields => false }
  }

  # ---------------- WINDOWS (Winlogbeat) ----------------
  else if [winlog] {
    if [winlog][channel] == "Security" and [event][code] in ["4624","4625","4634","4647","4648","4672","4768","4769","4771","4776","4720","4722","4723","4724","4725","4726","4728","4732","4738","4740","4756"] {
      mutate { add_field => { "[@metadata][soc_type]" => "auth" } }
    }
    else if ([winlog][channel] == "Security" and [event][code] in ["5152","5154","5156","5157","5158"]) or ([winlog][channel] == "Microsoft-Windows-Sysmon/Operational" and [event][code] in ["3","22"]) {
      mutate { add_field => { "[@metadata][soc_type]" => "network" } }
    }
    else {
      mutate { add_field => { "[@metadata][soc_type]" => "endpoint" } }
    }

    # Zaman esasli aşkarlama ucun (Baku, UTC+4) saat sahesi
    ruby { code => "t = event.get('@timestamp').time.utc; event.set('[soc][hour]', (t.hour + 4) % 24)" }

    # DNS tunneling ucun sorgu uzunlugu
    if [event][code] == "22" and [winlog][event_data][QueryName] {
      ruby { code => "q = event.get('[winlog][event_data][QueryName]'); event.set('[soc][dns_len]', q.length) if q.is_a?(String)" }
    }
  }

  # Taninmayan menbe
  if ![@metadata][soc_type] { mutate { add_field => { "[@metadata][soc_type]" => "endpoint" } } }

  # Butun menbeler ucun menbe etiketi
  mutate { add_field => { "[soc][source_type]" => "%{[@metadata][soc_type]}" } }
}
