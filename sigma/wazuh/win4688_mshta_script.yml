title: Mshta Script or URL Execution (Security 4688)
id: b25e30a6-b4c9-580f-91ef-72560c0bdd0a
status: test
description: mshta vbscript/javascript/URL (T1218.005); Security 4688.
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.defense_evasion
- attack.t1218.005
logsource:
  product: windows
  service: security
detection:
  selection:
    NewProcessName|endswith: \mshta.exe
    CommandLine|contains:
    - 'vbscript:'
    - 'javascript:'
    - http://
    - https://
  condition: selection
falsepositives:
- Nadir
level: high
x_test: mshta.exe vbscript:Close(Execute("x=1"))
x_wazuh_id: 100520
x_wazuh_if_sid: 67027
