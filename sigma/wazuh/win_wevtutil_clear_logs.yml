title: Windows Event Log Clearing (wevtutil)
id: 3664b4ad-411c-5ca5-977a-d1f091c2adc1
status: test
description: wevtutil ile event log silinməsi (T1070.001).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.defense_evasion
- attack.t1070.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \wevtutil.exe
    CommandLine|contains:
    - ' cl '
    - ' clear-log '
  condition: selection
falsepositives:
- Sistem administratorunun planlı təmizliyi
level: high
x_test: wevtutil cl SOCNoSuchLog   (log yoxdur - zərərsiz)
x_wazuh_id: 100360
