title: Shell Spawned by WMI Provider Host
id: eca01011-cdf5-5afe-9451-e474ac55a3e5
status: test
description: WmiPrvSE.exe cmd/powershell/mshta başladır (T1047).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.execution
- attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: \wmiprvse.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \mshta.exe
