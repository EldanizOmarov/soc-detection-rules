title: Local Account Discovery (net user/localgroup)
id: 254d3ffd-017d-564e-a51f-3b13416c357c
status: test
description: net user / net localgroup ile hesab kəşfiyyatı (T1087.001).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.discovery
- attack.t1087.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains:
    - ' user'
    - ' localgroup'
    - ' accounts'
  condition: selection
falsepositives:
- Administratorların gündəlik işi (yüksək FP)
level: low
x_test: net user ; net localgroup administrators
x_wazuh_id: 100430
