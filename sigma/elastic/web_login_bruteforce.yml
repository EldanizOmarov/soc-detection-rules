title: Web Login Brute Force (401 burst)
id: 15790d24-9190-5314-8e03-8dbc1b738031
status: test
description: 5 dəqiqədə eyni IP-dən /login ucun 10+ 401 (T1110).
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.credential_access
- attack.t1110
logsource:
  product: webserver
detection:
  selection:
    c-uri|startswith: /login
    sc-status: '401'
  timeframe: 5m
  condition: selection | count() by c-ip >= 10
falsepositives:
- Unudulmuş parol
level: high
x_test: python3 deploy/gen_logs.py web-brute
